          <button class="guide-entry">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="icon-like-guide">
              <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
            </svg>
            <span class="guide-label">Vídeos que me gus...</span>
          </button>

          <button class="guide-entry">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M10 8v8l5-4-5-4zm9-5H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
            </svg>
            <span class="guide-label">Mis vídeos</span>
          </button>

          <button class="guide-entry">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M17 18v1H3v-1h14zm.5-6.6l-.7-.7-3.8 3.7V4h-1v10.4l-3.8-3.8-.7.7 5 5 5-4.9z"/>
            </svg>
            <span class="guide-label">Descargas</span>
          </button>
        </div>

        <div class="guide-divider"></div>

        <!-- Más de YouTube -->
        <div class="guide-section">
          <div class="guide-header-title">
            <span>Más de YouTube</span>
          </div>
          <button class="guide-entry">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="#ff0000">
              <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73z"/>
            </svg>
            <span class="guide-label">Probar Premium...</span>
          </button>
        </div>

      </div>
    </aside>

    <!-- ==================== CONTENT AREA ==================== -->
    <main class="content-area" id="content-area">
      
      <!-- Category Chips Filter Row (Subheader) -->
      <div class="chips-bar-wrap" id="chips-bar-wrap">
        <div class="chips-scroll-row" id="chips-scroll-row">
          <!-- Populated by JS -->
        </div>
        <div class="search-top-tools hidden" id="search-top-tools">
          <button type="button" class="search-tool-btn" id="btn-about-results" title="Acerca de estos resultados">
            <span>Acerca de estos resultados</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
          </button>
          <button type="button" class="search-tool-btn" id="btn-search-filters" title="Filtros">
            <span>Filtros</span>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- VIEW 1: HOME FEED (Pantalla Principal de YouTube) -->
      <section class="home-view" id="home-view">
        <div class="video-grid" id="home-video-grid">
          <!-- Llenado dinámicamente con los vídeos -->
        </div>
        <div class="home-show-more-wrap" id="home-show-more-wrap">
          <button type="button" class="btn-show-more" id="btn-show-more">
            <span>Mostrar más</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 14.975 5.988 8.962l.707-.707L12 13.56l5.305-5.305.707.707L12 14.975z"/>
            </svg>
          </button>
        </div>
      </section>

      <!-- VIEW 2: SEARCH RESULTS (Pantalla de Búsqueda Falsa) -->
      <section class="search-view hidden" id="search-view">
        <div class="search-results-flow" id="search-results-flow">
          <!-- Renderizado dinámico de tarjetas de canal y vídeos en el orden especificado -->
        </div>
      </section>

    </main>
  </div>

  <!-- ==================== PERSONALIZAR BÚSQUEDAS MODAL ==================== -->
  <div class="modal-backdrop hidden" id="editor-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Personalizar Búsquedas</h3>
        <button class="modal-close-btn" id="btn-close-editor" title="Cerrar">&times;</button>
      </div>
      
      <div class="modal-body">
        
        <div class="editor-section-header">
          <span class="editor-section-title">Tarjetas de resultados</span>
          <div class="editor-add-actions">
            <button type="button" class="btn-action-add" id="btn-add-video-card">+ Vídeo</button>
            <button type="button" class="btn-action-add" id="btn-add-channel-card">+ Canal</button>
            <button type="button" class="btn-action-tool" id="btn-export-yt" title="Exportar archivo .yt">Exportar .yt</button>
            <button type="button" class="btn-action-tool" id="btn-import-yt" title="Importar archivo .yt">Importar .yt</button>
            <input type="file" id="file-import-yt" accept=".yt,.json" style="display:none;">
          </div>
        </div>

        <!-- Lista dinámica de tarjetas ordenables -->
        <div class="cards-list-container" id="editor-cards-list">
          <!-- Renderizado dinámico de tarjetas -->
        </div>

      </div>

      <div class="modal-footer" style="justify-content: flex-end;">
        <button type="button" class="btn-modal-primary" id="btn-save-editor">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <!-- ==================== PERSONALIZAR USUARIO MODAL ==================== -->
  <div class="modal-backdrop hidden" id="user-profile-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Personalizar Usuario</h3>
        <button class="modal-close-btn" id="btn-close-user-modal" title="Cerrar">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input type="text" id="user-edit-name-inp" class="form-input" placeholder="Nombre de usuario">
        </div>

        <div class="form-group">
          <label class="form-label">Canal</label>
          <div style="display:flex; gap:6px;">
            <input type="text" id="user-edit-tag-inp" class="form-input" placeholder="@nombrecanal" style="flex:1;">
            <button type="button" class="btn-tag-fetch" id="btn-user-fetch-tag">Obtener</button>
            <input type="file" id="user-file-input" accept="image/*" style="display:none;">
            <button type="button" class="file-picker-btn" id="btn-user-pick-file">Subir</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Icono de usuario</label>
          <div style="display:flex; align-items:center; gap:14px; margin-top:6px;">
            <div id="user-edit-avatar-preview" class="user-avatar-circle" style="width:52px; height:52px; flex-shrink:0; overflow:hidden;"></div>
            <button type="button" class="file-picker-btn" id="btn-user-reset-circle" style="font-size:12px;">Círculo blanco por defecto</button>
          </div>
        </div>
      </div>

      <div class="modal-footer" style="justify-content: flex-end;">
        <button type="button" class="btn-modal-primary" id="btn-save-user-profile">Guardar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="/youtubefake/script.js"></script>

</body>
</html>
